services:
  mysql:
    image: mysql:8.0
    container_name: finance_tracker_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-finance_root_secret}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-finance_tracker}
      MYSQL_USER: ${MYSQL_USER:-finance_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-finance_secret}
    ports:
      # Host port 3307 mapped to container 3306 to avoid conflict with existing local MySQL on port 3306
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-finance_root_secret}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: finance_tracker_api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-finance_user}:${MYSQL_PASSWORD:-finance_secret}@mysql:3306/${MYSQL_DATABASE:-finance_tracker}
      PORT: ${API_PORT:-8000}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app

volumes:
  mysql_data:
    driver: local
