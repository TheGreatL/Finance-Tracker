name: Deploy Mobile Update (OTA)

on:
    push:
        branches:
            - main
        paths:
            - 'apps/mobile/**'
            - 'packages/**'
            - '.github/workflows/deploy-mobile-update.yml'
    workflow_dispatch:
        inputs:
            message:
                description: 'Update message / description'
                required: false
                default: 'Manual OTA update'
                type: string
            channel:
                description: 'EAS Channel'
                required: false
                default: 'production'
                type: string

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    update:
        name: Publish EAS Update
        runs-on: ubuntu-latest
        steps:
            - name: ⬇️ Checkout repository
              uses: actions/checkout@v4

            - name: 🟢 Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: 'npm'

            - name: 📦 Setup Expo & EAS
              uses: expo/expo-github-action@v8
              with:
                  eas-version: latest
                  packager: npm
                  token: ${{ secrets.EXPO_TOKEN }}

            - name: 📥 Install dependencies
              run: npm ci

            - name: 🚀 Publish OTA Update
              working-directory: apps/mobile
              env:
                  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
              run: |
                  MESSAGE="${{ github.event.inputs.message || github.event.head_commit.message || 'Automated OTA update from main' }}"
                  CHANNEL="${{ github.event.inputs.channel || 'production' }}"
                  eas update --channel "$CHANNEL" --message "$MESSAGE" --non-interactive
